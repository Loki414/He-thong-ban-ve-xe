# ========== Database (MySQL 8) ==========
# Backend chạy trên máy Windows → kết nối tới MySQL: localhost:3306 (Docker map 3306:3306).
# Bắt buộc khớp: tên DB, user, password với MySQL thật (Docker MYSQL_* hoặc Workbench).
# Có thể ghi đè bằng biến môi trường khi chạy (không cần sửa file):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bus_ticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate 6: dùng MySQLDialect cho MySQL 8 (MySQL8Dialect đã deprecated)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.security.filter.dispatcher-types=REQUEST
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

jwt.secret=change_this_secret_in_prod_change_this_secret_in_prod
jwt.expiration-ms=86400000
jwt.expiration-remember-ms=1209600000

google.oauth.client-id=${GOOGLE_CLIENT_ID:789219721567-msqsmf12sam42mqi12buvlrng0tfln90.apps.googleusercontent.com}

auth.password-reset.log-otp=true
auth.password-reset.ttl-minutes=15

server.port=8080

