<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập – BusBooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-bg {
      flex: 1;
      background: linear-gradient(135deg, #1e6fff 0%, #0f4edb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .auth-card { max-width: 420px; width: 100%; }
    #errMsg { display: none; }
  </style>
</head>
<body>
<span id="themeToggleContainer" style="position:fixed;top:12px;right:12px;z-index:100"></span>
<div class="auth-bg">
  <div class="auth-card bg-white rounded-4 shadow-lg p-4 p-md-5">

    <div class="auth-logo mb-1">🚌 BusBooking</div>
    <h4 class="fw-bold mb-1">Đăng nhập</h4>
    <p class="text-muted small mb-4">Nhập tài khoản và mật khẩu để tiếp tục.</p>

    <div id="errMsg" class="alert alert-danger py-2 small mb-3"></div>

    <div class="mb-3">
      <label class="form-label" for="username">Tài khoản hoặc Email</label>
      <input id="username" type="text" class="form-control"
             placeholder="Ví dụ: nguyenvana hoặc email@example.com"
             autocomplete="username">
    </div>

    <div class="mb-4">
      <label class="form-label" for="password">Mật khẩu</label>
      <div class="position-relative">
        <input id="password" type="password" class="form-control"
               placeholder="Nhập mật khẩu"
               autocomplete="current-password">
        <button type="button"
                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent text-muted p-0"
                onclick="togglePwd()">👁</button>
      </div>
    </div>

    <button class="btn btn-primary w-100 fw-semibold py-2 mb-3"
            id="loginBtn" onclick="doLogin()">
      Đăng nhập
    </button>

    <p class="small text-center text-muted mb-0">
      Chưa có tài khoản?
      <a href="/register" class="text-primary fw-semibold">Đăng ký ngay</a>
    </p>

  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  function togglePwd() {
    const inp = document.getElementById("password")
    inp.type = inp.type === "password" ? "text" : "password"
  }

  function showError(msg) {
    const el = document.getElementById("errMsg")
    el.style.display = "block"
    el.innerText = msg
  }

  async function doLogin() {
    const btn = document.getElementById("loginBtn")
    btn.disabled = true
    btn.innerText = "Đang đăng nhập..."
    document.getElementById("errMsg").style.display = "none"

    try {
      await login()
    } catch (e) {
      showError("Có lỗi xảy ra, thử lại.")
    } finally {
      btn.disabled = false
      btn.innerText = "Đăng nhập"
    }
  }

  // Override alert từ auth.js để hiển thị lỗi inline, không dùng popup trình duyệt
  window.alert = function(msg) {
    if (!msg) return
    const lc = msg.toLowerCase()
    // Khi thành công, auth.js sẽ redirect – không cần hiện gì
    if (lc.includes("thành công") || lc.includes("success")) return
    // Mọi thông báo khác (lỗi, cảnh báo, debug) đều hiển thị inline
    showError(msg)
  }

  // Enter key support
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doLogin()
  })
</script>

</body>
</html>
