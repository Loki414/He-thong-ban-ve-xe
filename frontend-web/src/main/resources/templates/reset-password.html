<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu – BusBooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <style>.notyf { z-index: 99999; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-600 via-orange-600 to-rose-700 font-sans antialiased">
<span id="themeToggleContainer" class="fixed top-4 right-4 z-50"></span>

<div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-md rounded-2xl bg-white/95 backdrop-blur shadow-2xl shadow-black/20 ring-1 ring-black/5 p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="text-3xl mb-1" aria-hidden="true">🔑</div>
      <h1 class="text-2xl font-bold text-slate-900">Đặt mật khẩu mới</h1>
      <p class="mt-2 text-sm text-slate-500">Nhập mã OTP đã nhận và mật khẩu mới (tối thiểu 8 ký tự).</p>
    </div>

    <form id="resetForm" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-slate-900 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20"
               placeholder="email@example.com">
      </div>
      <div>
        <label for="code" class="block text-sm font-medium text-slate-700 mb-1">Mã OTP</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"
               class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-slate-900 tracking-widest text-center text-lg font-mono shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20"
               placeholder="000000">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu mới</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="new-password"
                 class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 pr-11 text-slate-900 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20"
                 placeholder="Tối thiểu 8 ký tự">
          <button type="button" data-toggle-pwd data-target="password" aria-label="Hiện mật khẩu"
                  class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-500 hover:bg-slate-100">
            <svg data-eye-open xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <svg data-eye-off xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </div>
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Nhập lại mật khẩu</label>
        <div class="relative">
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                 class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 pr-11 text-slate-900 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/20"
                 placeholder="Khớp với mật khẩu mới">
          <button type="button" data-toggle-pwd data-target="confirmPassword" aria-label="Hiện mật khẩu"
                  class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-500 hover:bg-slate-100">
            <svg data-eye-open xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <svg data-eye-off xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="resetSubmit"
              class="w-full rounded-xl bg-orange-600 py-3 text-sm font-semibold text-white shadow-lg shadow-orange-600/30 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 disabled:opacity-60">
        Đặt mật khẩu mới
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      <a href="/login" class="font-semibold text-orange-600 hover:text-orange-700">Đăng nhập</a>
      ·
      <a href="/forgot-password" class="font-semibold text-orange-600 hover:text-orange-700">Gửi lại OTP</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script th:inline="javascript">
  window.__API_BASE__ = /*[[${apiBase}]]*/ 'http://localhost:8080/api';
</script>
<script src="js/auth-state.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/auth/reset-page.mjs"></script>
</body>
</html>
