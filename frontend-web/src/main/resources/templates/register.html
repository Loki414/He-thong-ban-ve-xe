<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký – BusBooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-bg {
      flex: 1;
      background: linear-gradient(135deg, #1e6fff 0%, #0f4edb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    #errMsg, #okMsg { display: none; }
  </style>
</head>
<body>
<span id="themeToggleContainer" style="position:fixed;top:12px;right:12px;z-index:100"></span>
<div class="auth-bg">
  <div class="auth-card bg-white rounded-4 shadow-lg p-4 p-md-5">

    <div class="auth-logo mb-1">🚌 BusBooking</div>
    <h4 class="fw-bold mb-1">Tạo tài khoản</h4>
    <p class="text-muted small mb-4">Điền thông tin bên dưới để đăng ký.</p>

    <div id="errMsg" class="alert alert-danger py-2 small mb-3"></div>
    <div id="okMsg" class="alert alert-success py-2 small mb-3"></div>

    <div class="mb-3">
      <label class="form-label" for="username">Tài khoản</label>
      <input id="username" type="text" class="form-control"
             placeholder="Ít nhất 3 ký tự, không dấu"
             autocomplete="username">
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" class="form-control"
             placeholder="email@example.com"
             autocomplete="email">
    </div>

    <div class="mb-4">
      <label class="form-label" for="password">Mật khẩu</label>
      <div class="position-relative">
        <input id="password" type="password" class="form-control"
               placeholder="Tối thiểu 6 ký tự"
               autocomplete="new-password">
        <button type="button"
                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent text-muted p-0"
                onclick="togglePwd()">👁</button>
      </div>
    </div>

    <button class="btn btn-success w-100 fw-semibold py-2 mb-3"
            id="regBtn" onclick="doRegister()">
      Đăng ký
    </button>

    <p class="small text-center text-muted mb-0">
      Đã có tài khoản?
      <a href="/login" class="text-primary fw-semibold">Đăng nhập</a>
    </p>

  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  function togglePwd() {
    const inp = document.getElementById("password")
    inp.type = inp.type === "password" ? "text" : "password"
  }

  function showError(msg) {
    document.getElementById("okMsg").style.display = "none"
    const el = document.getElementById("errMsg")
    el.style.display = "block"
    el.innerText = msg
  }

  function showOk(msg) {
    document.getElementById("errMsg").style.display = "none"
    const el = document.getElementById("okMsg")
    el.style.display = "block"
    el.innerText = msg
  }

  async function doRegister() {
    const btn = document.getElementById("regBtn")
    btn.disabled = true
    btn.innerText = "Đang đăng ký..."
    document.getElementById("errMsg").style.display = "none"
    document.getElementById("okMsg").style.display = "none"

    try {
      await register()
    } catch (e) {
      showError("Có lỗi xảy ra, thử lại.")
    } finally {
      btn.disabled = false
      btn.innerText = "Đăng ký"
    }
  }

  // Override alert để hiển thị inline, không dùng popup trình duyệt
  window.alert = function(msg) {
    if (!msg) return
    const lc = msg.toLowerCase()
    // Thành công → redirect sẽ xảy ra, không hiện gì cả
    if (lc.includes("thành công") || lc.includes("success")) return
    // Lỗi → hiện inline
    showError(msg)
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doRegister()
  })
</script>

</body>
</html>
