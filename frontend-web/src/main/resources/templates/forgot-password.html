<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu – BusBooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <style>.notyf { z-index: 99999; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-indigo-900 font-sans antialiased">
<span id="themeToggleContainer" class="fixed top-4 right-4 z-50"></span>

<div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-md rounded-2xl bg-white/95 backdrop-blur shadow-2xl shadow-black/20 ring-1 ring-black/5 p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="text-3xl mb-1" aria-hidden="true">🔐</div>
      <h1 class="text-2xl font-bold text-slate-900">Quên mật khẩu</h1>
      <p class="mt-2 text-sm text-slate-500">Nhập email đã đăng ký. Hệ thống tạo mã OTP (xem log backend nếu chưa có SMTP).</p>
    </div>

    <form id="forgotForm" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-slate-900 shadow-sm focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20"
               placeholder="email@example.com">
      </div>
      <button type="submit" id="forgotSubmit"
              class="w-full rounded-xl bg-violet-600 py-3 text-sm font-semibold text-white shadow-lg shadow-violet-600/30 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:opacity-60">
        Gửi mã OTP
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      <a href="/login" class="font-semibold text-violet-600 hover:text-violet-700">← Quay lại đăng nhập</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script th:inline="javascript">
  window.__API_BASE__ = /*[[${apiBase}]]*/ 'http://localhost:8080/api';
</script>
<script src="js/auth-state.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/auth/forgot-page.mjs"></script>
</body>
</html>
