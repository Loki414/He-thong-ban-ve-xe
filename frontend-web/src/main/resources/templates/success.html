<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt vé thành công – BusBooking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/">🚌 BusBooking</a>
    <div class="ms-auto"><span id="themeToggleContainer"></span></div>
  </div>
</nav>

<div class="success-wrap">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card border-0 shadow rounded-4">
          <div class="card-body p-4 p-md-5 text-center">

            <!-- Animated checkmark -->
            <div class="success-checkmark" id="successIcon">
              <span>✔</span>
            </div>

            <h3 class="fw-bold mb-1" id="successTitle">Đặt vé thành công!</h3>
            <p class="text-muted mb-4" id="successDesc">
              Cảm ơn bạn đã đặt vé với BusBooking. Chúc bạn có chuyến đi vui vẻ!
            </p>

            <!-- Ticket detail -->
            <div class="success-ticket-info text-start mb-4">
              <div class="ticket-row">
                <span class="t-label">Mã vé</span>
                <span class="t-val" id="sTicketId">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Tuyến</span>
                <span class="t-val" id="sRoute">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Khởi hành</span>
                <span class="t-val" id="sDep">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Xe</span>
                <span class="t-val" id="sBus">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Ghế</span>
                <span class="t-val fw-bold text-warning" id="sSeat">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Thanh toán</span>
                <span class="t-val" id="sMethod">—</span>
              </div>
              <div class="ticket-row">
                <span class="t-label">Trạng thái</span>
                <span class="t-val fw-bold" id="sStatus">—</span>
              </div>
            </div>

            <div class="d-grid gap-2">
              <a href="/" class="btn btn-primary fw-semibold">Về trang chủ</a>
              <a href="/trips" class="btn btn-outline-secondary">Đặt vé chuyến khác</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/theme.js"></script>
<script>
  function formatDep(raw) {
    if (!raw) return "—"
    try {
      const v = JSON.parse(raw)
      const d = Array.isArray(v)
        ? new Date(v[0], v[1]-1, v[2], v[3]||0, v[4]||0)
        : new Date(v)
      return d.toLocaleString("vi-VN", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      })
    } catch { return raw }
  }

  const methodLabels = {
    CREDIT_CARD: "Thẻ tín dụng", CASH: "Tiền mặt",
    BANK_TRANSFER: "Chuyển khoản ngân hàng", E_WALLET: "Ví điện tử"
  }

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val || "—" }

  set("sTicketId", "#" + (localStorage.getItem("ticketId") || "—"))
  set("sRoute", `${localStorage.getItem("tripOrigin") || ""} → ${localStorage.getItem("tripDestination") || ""}`)
  set("sDep", formatDep(localStorage.getItem("tripDepartureTime")))
  set("sBus", `${localStorage.getItem("tripBusNumber") || ""} · ${localStorage.getItem("tripBusType") || ""}`)
  set("sSeat", localStorage.getItem("seatNumber") || localStorage.getItem("seatId") || "—")
  const method = localStorage.getItem("paymentMethod") || "CREDIT_CARD"
  set("sMethod", methodLabels[method] || method)

  // Show status with appropriate label and colour
  const rawStatus = localStorage.getItem("paymentStatus") || "SUCCESS"
  const statusEl  = document.getElementById("sStatus")
  const isCash    = method === "CASH" || rawStatus === "PENDING"

  if (isCash) {
    statusEl.innerText = "⏳ Chờ thu tiền mặt"
    statusEl.style.color = "#e65c00"

    document.getElementById("successTitle").innerText = "Vé đã được đặt!"
    document.getElementById("successDesc").innerHTML =
      'Ghế của bạn đã được giữ. Vui lòng <strong>thanh toán tiền mặt</strong> khi lên xe.<br>' +
      '<span class="text-warning fw-semibold">Xuất trình mã vé cho nhân viên.</span>'
    // Change icon colour to orange
    document.getElementById("successIcon").style.background =
      "linear-gradient(135deg, #ff9800, #e65c00)"
  } else {
    statusEl.innerText = "✅ Đã thanh toán"
    statusEl.style.color = "#198754"
  }

  // Clean up booking keys after showing confirmation
  const keysToClean = ["ticketId","seatId","seatNumber","seatLockExpiresAt"]
  keysToClean.forEach(k => localStorage.removeItem(k))
</script>

</body>
</html>
